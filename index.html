<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>حسابداری و انبارداری</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { vazir: ['Vazirmatn', 'Tahoma', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 75px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-safe">

  <!-- نوار بالای صفحه -->
  <header class="sticky top-0 z-30 backdrop-blur-md bg-white/90 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between shadow-xs">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">
        📊
      </div>
      <div>
        <h1 class="font-bold text-sm" id="store-title">حسابداری و انبارداری</h1>
        <p class="text-[10px] text-slate-500 dark:text-slate-400" id="header-date">در حال بارگذاری...</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs">
        🌓 تم
      </button>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- تب ۱: داشبورد -->
    <section id="tab-dashboard" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 p-3 rounded-2xl">
          <span class="text-xs text-emerald-600 dark:text-emerald-400 font-bold block mb-1">فروش کل</span>
          <div class="text-lg font-extrabold text-slate-900 dark:text-white" id="dash-sales">۰</div>
          <span class="text-[10px] text-slate-400">تومان</span>
        </div>
        <div class="bg-sky-50 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-800 p-3 rounded-2xl">
          <span class="text-xs text-sky-600 dark:text-sky-400 font-bold block mb-1">خرید کل</span>
          <div class="text-lg font-extrabold text-slate-900 dark:text-white" id="dash-purchases">۰</div>
          <span class="text-[10px] text-slate-400">تومان</span>
        </div>
        <div class="bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 p-3 rounded-2xl">
          <span class="text-xs text-indigo-600 dark:text-indigo-400 font-bold block mb-1">سود ناخالص</span>
          <div class="text-lg font-extrabold text-indigo-600 dark:text-indigo-400" id="dash-profit">۰</div>
          <span class="text-[10px] text-slate-400">تومان</span>
        </div>
        <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 p-3 rounded-2xl">
          <span class="text-xs text-amber-600 dark:text-amber-400 font-bold block mb-1">ارزش موجودی انبار</span>
          <div class="text-lg font-extrabold text-slate-900 dark:text-white" id="dash-stock-value">۰</div>
          <span class="text-[10px] text-slate-400">تومان</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-1">
        <button onclick="switchTab('sales'); openAddSaleModal();" class="p-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl text-xs font-bold shadow-md text-center">
          + ثبت فروش جدید
        </button>
        <button onclick="switchTab('purchases'); openAddPurchaseModal();" class="p-3 bg-sky-600 hover:bg-sky-700 text-white rounded-2xl text-xs font-bold shadow-md text-center">
          + ثبت خرید / فاکتور
        </button>
      </div>

      <!-- کالاهای روبه‌اتمام -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800">
        <h2 class="font-bold text-xs text-amber-600 mb-2">⚠️ کالاهای رو به اتمام (کمتر از ۳ عدد)</h2>
        <div id="low-stock-list" class="space-y-2 text-xs"></div>
      </div>
    </section>

    <!-- تب ۲: انبار کالاها -->
    <section id="tab-inventory" class="hidden space-y-4">
      <div class="flex gap-2">
        <input type="text" id="inv-search" oninput="renderInventory()" placeholder="جستجوی نام کالا..." class="flex-1 px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs">
        <button onclick="openAddProductModal()" class="px-3 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">
          + کالای جدید
        </button>
      </div>
      <div id="inventory-list" class="space-y-3"></div>
    </section>

    <!-- تب ۳: فروش -->
    <section id="tab-sales" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-sm">فاکتورهای فروش روزانه</h2>
        <button onclick="openAddSaleModal()" class="px-3 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">
          + ثبت فروش
        </button>
      </div>
      <div id="sales-list" class="space-y-3"></div>
    </section>

    <!-- تب ۴: خرید -->
    <section id="tab-purchases" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-sm">فاکتورهای خرید و تامین</h2>
        <button onclick="openAddPurchaseModal()" class="px-3 py-1.5 bg-sky-600 text-white rounded-xl text-xs font-bold">
          + ثبت خرید
        </button>
      </div>
      <div id="purchases-list" class="space-y-3"></div>
    </section>

    <!-- تب ۵: تنظیمات و بکاپ -->
    <section id="tab-reports" class="hidden space-y-4">
      <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
        <h3 class="font-bold text-xs">نام فروشگاه</h3>
        <input type="text" id="store-name-input" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs">
        <button onclick="saveStoreName()" class="w-full py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">ذخیره نام</button>
      </div>

      <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2">
        <h3 class="font-bold text-xs">پشتیبان‌گیری</h3>
        <button onclick="exportDataJSON()" class="w-full py-2 bg-slate-100 dark:bg-slate-800 text-xs font-bold rounded-xl">دانلود فایل پشتیبان (JSON)</button>
        <button onclick="exportDataCSV()" class="w-full py-2 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 text-xs font-bold rounded-xl">دانلود خروجی اکسل (CSV)</button>
      </div>
    </section>

  </main>

  <!-- منوی پایین -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 border-t border-slate-200 dark:border-slate-800 px-3 py-2">
    <div class="max-w-xl mx-auto flex items-center justify-around text-[10px] font-bold">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="text-indigo-600">داشبورد</button>
      <button onclick="switchTab('inventory')" id="nav-inventory" class="text-slate-400">انبار کالا</button>
      <button onclick="switchTab('sales')" id="nav-sales" class="text-slate-400">فروش</button>
      <button onclick="switchTab('purchases')" id="nav-purchases" class="text-slate-400">خرید</button>
      <button onclick="switchTab('reports')" id="nav-reports" class="text-slate-400">تنظیمات</button>
    </div>
  </nav>

  <!-- مودال افزودن/ویرایش کالا -->
  <div id="modal-product" class="fixed inset-0 z-50 bg-black/60 p-4 hidden flex items-center justify-center">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-sm space-y-3">
      <h3 id="modal-product-title" class="font-bold text-sm">کالای جدید</h3>
      <form onsubmit="handleProductSubmit(event)" class="space-y-2 text-xs">
        <input type="hidden" id="p-id">
        <input type="text" id="p-name" required placeholder="نام کالا" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="p-buy" required placeholder="قیمت خرید" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
          <input type="number" id="p-sell" required placeholder="قیمت فروش" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
        </div>
        <input type="number" id="p-stock" required placeholder="موجودی" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-product')" class="w-1/3 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl">انصراف</button>
          <button type="submit" class="w-2/3 py-2 bg-indigo-600 text-white rounded-xl font-bold">ذخیره</button>
        </div>
      </form>
    </div>
  </div>

  <!-- مودال ثبت/ویرایش فروش -->
  <div id="modal-sale" class="fixed inset-0 z-50 bg-black/60 p-4 hidden flex items-center justify-center">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-sm space-y-3">
      <h3 id="modal-sale-title" class="font-bold text-sm text-emerald-600">ثبت فروش روزانه</h3>
      <form onsubmit="handleSaleSubmit(event)" class="space-y-2 text-xs">
        <input type="hidden" id="s-id">
        <select id="s-product" required onchange="onSaleProductChange()" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border"></select>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="s-qty" required min="1" value="1" placeholder="تعداد" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
          <input type="number" id="s-price" required placeholder="قیمت واحد" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
        </div>
        <input type="text" id="s-customer" placeholder="نام مشتری" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-sale')" class="w-1/3 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl">انصراف</button>
          <button type="submit" class="w-2/3 py-2 bg-emerald-600 text-white rounded-xl font-bold">ثبت فروش</button>
        </div>
      </form>
    </div>
  </div>

  <!-- مودال ثبت/ویرایش خرید -->
  <div id="modal-purchase" class="fixed inset-0 z-50 bg-black/60 p-4 hidden flex items-center justify-center">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-sm space-y-3">
      <h3 id="modal-purchase-title" class="font-bold text-sm text-sky-600">ثبت فاکتور خرید</h3>
      <form onsubmit="handlePurchaseSubmit(event)" class="space-y-2 text-xs">
        <input type="hidden" id="b-id">
        <select id="b-product" required onchange="onPurchaseProductChange()" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border"></select>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="b-qty" required min="1" value="1" placeholder="تعداد" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
          <input type="number" id="b-price" required placeholder="قیمت واحد" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
        </div>
        <input type="text" id="b-supplier" placeholder="نام تامین‌کننده" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border">
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-purchase')" class="w-1/3 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl">انصراف</button>
          <button type="submit" class="w-2/3 py-2 bg-sky-600 text-white rounded-xl font-bold">ثبت خرید</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // تنظیمات پایه و اتصال به تلگرام
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try { tg.ready(); tg.expand(); } catch (e) {}
    }

    const KEY = 'APP_ACCOUNTING_DATA_V1';
    let db = {
      name: 'فروشگاه حسابداری',
      products: [
        { id: '1', name: 'هندزفری سامسونگ تایپ سی', buy: 75000, sell: 140000, stock: 10 },
        { id: '2', name: 'کابل فست آیفون', buy: 50000, sell: 95000, stock: 2 }
      ],
      sales: [],
      purchases: []
    };

    function loadDB() {
      try {
        const saved = localStorage.getItem(KEY);
        if (saved) db = JSON.parse(saved);
      } catch (e) {}
      saveDB();
    }

    function saveDB() {
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
      renderAll();
    }

    function formatNum(n) {
      return new Intl.NumberFormat('fa-IR').format(Math.round(n || 0));
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    function switchTab(t) {
      ['dashboard', 'inventory', 'sales', 'purchases', 'reports'].forEach(tab => {
        document.getElementById('tab-' + tab).classList.toggle('hidden', tab !== t);
        const nav = document.getElementById('nav-' + tab);
        if (nav) nav.className = (tab === t) ? 'text-indigo-600 font-bold' : 'text-slate-400 font-bold';
      });
      window.scrollTo(0,0);
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function renderAll() {
      document.getElementById('store-title').innerText = db.name || 'فروشگاه حسابداری';
      document.getElementById('store-name-input').value = db.name || '';
      document.getElementById('header-date').innerText = new Intl.DateTimeFormat('fa-IR', { dateStyle: 'long' }).format(new Date());

      // آمار
      const totalSales = db.sales.reduce((acc, s) => acc + (Number(s.total) || 0), 0);
      const totalPurchases = db.purchases.reduce((acc, p) => acc + (Number(p.total) || 0), 0);
      const totalProfit = db.sales.reduce((acc, s) => acc + (Number(s.profit) || 0), 0);
      const stockVal = db.products.reduce((acc, p) => acc + ((Number(p.stock) || 0) * (Number(p.buy) || 0)), 0);

      document.getElementById('dash-sales').innerText = formatNum(totalSales);
      document.getElementById('dash-purchases').innerText = formatNum(totalPurchases);
      document.getElementById('dash-profit').innerText = formatNum(totalProfit);
      document.getElementById('dash-stock-value').innerText = formatNum(stockVal);

      // کالاهای رو به اتمام
      const low = db.products.filter(p => Number(p.stock) <= 2);
      document.getElementById('low-stock-list').innerHTML = low.length === 0 
        ? '<p class="text-slate-400 text-center py-2">همه کالاها موجودی کافی دارند.</p>'
        : low.map(p => `<div class="flex justify-between border-b border-slate-100 dark:border-slate-800 py-1"><span>${p.name}</span><b class="text-rose-500">${formatNum(p.stock)} عدد</b></div>`).join('');

      renderInventory();
      renderSales();
      renderPurchases();
      updateSelectOptions();
    }

    // انبار
    function renderInventory() {
      const q = (document.getElementById('inv-search')?.value || '').trim().toLowerCase();
      const list = db.products.filter(p => p.name.toLowerCase().includes(q));
      document.getElementById('inventory-list').innerHTML = list.map(p => `
        <div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 flex justify-between items-center text-xs">
          <div>
            <b class="text-sm block">${p.name}</b>
            <span class="text-slate-400">خرید: ${formatNum(p.buy)} | فروش: ${formatNum(p.sell)}</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-lg p-1">
              <button onclick="changeStock('${p.id}', -1)" class="w-6 h-6 font-bold">-</button>
              <b class="px-2">${formatNum(p.stock)}</b>
              <button onclick="changeStock('${p.id}', 1)" class="w-6 h-6 font-bold">+</button>
            </div>
            <button onclick="openEditProductModal('${p.id}')" class="text-indigo-600 font-bold px-1">ویرایش</button>
            <button onclick="deleteProduct('${p.id}')" class="text-rose-600 font-bold px-1">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function changeStock(id, delta) {
      const p = db.products.find(x => x.id === id);
      if (p) {
        p.stock = Math.max(0, Number(p.stock) + delta);
        saveDB();
      }
    }

    function openAddProductModal() {
      document.getElementById('p-id').value = '';
      document.getElementById('p-name').value = '';
      document.getElementById('p-buy').value = '';
      document.getElementById('p-sell').value = '';
      document.getElementById('p-stock').value = '';
      document.getElementById('modal-product-title').innerText = 'تعریف کالای جدید';
      document.getElementById('modal-product').classList.remove('hidden');
    }

    function openEditProductModal(id) {
      const p = db.products.find(x => x.id === id);
      if (!p) return;
      document.getElementById('p-id').value = p.id;
      document.getElementById('p-name').value = p.name;
      document.getElementById('p-buy').value = p.buy;
      document.getElementById('p-sell').value = p.sell;
      document.getElementById('p-stock').value = p.stock;
      document.getElementById('modal-product-title').innerText = 'ویرایش کالا';
      document.getElementById('modal-product').classList.remove('hidden');
    }

    function handleProductSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('p-id').value;
      const name = document.getElementById('p-name').value.trim();
      const buy = Number(document.getElementById('p-buy').value);
      const sell = Number(document.getElementById('p-sell').value);
      const stock = Number(document.getElementById('p-stock').value);

      if (id) {
        const item = db.products.find(x => x.id === id);
        if (item) { item.name = name; item.buy = buy; item.sell = sell; item.stock = stock; }
      } else {
        db.products.push({ id: String(Date.now()), name, buy, sell, stock });
      }
      closeModal('modal-product');
      saveDB();
    }

    function deleteProduct(id) {
      if (confirm('آیا این کالا حذف شود؟')) {
        db.products = db.products.filter(x => x.id !== id);
        saveDB();
      }
    }

    // فروش
    function renderSales() {
      document.getElementById('sales-list').innerHTML = db.sales.map(s => `
        <div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 flex justify-between items-center text-xs">
          <div>
            <b class="text-sm text-emerald-600 block">${s.productName}</b>
            <span class="text-slate-400">${formatNum(s.qty)} عدد | مشتری: ${s.customer || 'عادی'}</span>
          </div>
          <div class="text-left flex items-center gap-2">
            <div>
              <b class="block text-emerald-600">${formatNum(s.total)} ت</b>
              <span class="text-[10px] text-indigo-500">سود: ${formatNum(s.profit)}</span>
            </div>
            <button onclick="openEditSaleModal('${s.id}')" class="text-indigo-600 font-bold px-1">ویرایش</button>
            <button onclick="deleteSale('${s.id}')" class="text-rose-600 font-bold px-1">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function openAddSaleModal() {
      document.getElementById('s-id').value = '';
      document.getElementById('s-qty').value = '1';
      document.getElementById('s-customer').value = '';
      updateSelectOptions();
      onSaleProductChange();
      document.getElementById('modal-sale-title').innerText = 'ثبت فروش روزانه';
      document.getElementById('modal-sale').classList.remove('hidden');
    }

    function openEditSaleModal(id) {
      const s = db.sales.find(x => x.id === id);
      if (!s) return;
      updateSelectOptions();
      document.getElementById('s-id').value = s.id;
      document.getElementById('s-product').value = s.productId;
      document.getElementById('s-qty').value = s.qty;
      document.getElementById('s-price').value = s.price;
      document.getElementById('s-customer').value = s.customer;
      document.getElementById('modal-sale-title').innerText = 'ویرایش فاکتور فروش';
      document.getElementById('modal-sale').classList.remove('hidden');
    }

    function onSaleProductChange() {
      const pId = document.getElementById('s-product').value;
      const p = db.products.find(x => x.id === pId);
      if (p) document.getElementById('s-price').value = p.sell;
    }

    function handleSaleSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('s-id').value;
      const pId = document.getElementById('s-product').value;
      const qty = Number(document.getElementById('s-qty').value);
      const price = Number(document.getElementById('s-price').value);
      const customer = document.getElementById('s-customer').value.trim();

      const prod = db.products.find(x => x.id === pId);
      if (!prod) return;

      const total = qty * price;
      const profit = total - (qty * Number(prod.buy));

      if (id) {
        const sIndex = db.sales.findIndex(x => x.id === id);
        if (sIndex !== -1) {
          const old = db.sales[sIndex];
          prod.stock += (old.qty - qty);
          db.sales[sIndex] = { id, productId: pId, productName: prod.name, qty, price, total, profit, customer };
        }
      } else {
        prod.stock -= qty;
        db.sales.unshift({ id: String(Date.now()), productId: pId, productName: prod.name, qty, price, total, profit, customer });
      }
      closeModal('modal-sale');
      saveDB();
    }

    function deleteSale(id) {
      const s = db.sales.find(x => x.id === id);
      if (s && confirm('آیا فاکتور فروش حذف شود؟ (موجودی به انبار برمی‌گردد)')) {
        const prod = db.products.find(x => x.id === s.productId);
        if (prod) prod.stock += Number(s.qty);
        db.sales = db.sales.filter(x => x.id !== id);
        saveDB();
      }
    }

    // خرید
    function renderPurchases() {
      document.getElementById('purchases-list').innerHTML = db.purchases.map(b => `
        <div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 flex justify-between items-center text-xs">
          <div>
            <b class="text-sm text-sky-600 block">${b.productName}</b>
            <span class="text-slate-400">${formatNum(b.qty)} عدد | تامین‌کننده: ${b.supplier || '-'}</span>
          </div>
          <div class="text-left flex items-center gap-2">
            <b class="text-sky-600">${formatNum(b.total)} ت</b>
            <button onclick="openEditPurchaseModal('${b.id}')" class="text-indigo-600 font-bold px-1">ویرایش</button>
            <button onclick="deletePurchase('${b.id}')" class="text-rose-600 font-bold px-1">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function openAddPurchaseModal() {
      document.getElementById('b-id').value = '';
      document.getElementById('b-qty').value = '1';
      document.getElementById('b-supplier').value = '';
      updateSelectOptions();
      onPurchaseProductChange();
      document.getElementById('modal-purchase-title').innerText = 'ثبت خرید جدید';
      document.getElementById('modal-purchase').classList.remove('hidden');
    }

    function openEditPurchaseModal(id) {
      const b = db.purchases.find(x => x.id === id);
      if (!b) return;
      updateSelectOptions();
      document.getElementById('b-id').value = b.id;
      document.getElementById('b-product').value = b.productId;
      document.getElementById('b-qty').value = b.qty;
      document.getElementById('b-price').value = b.price;
      document.getElementById('b-supplier').value = b.supplier;
      document.getElementById('modal-purchase-title').innerText = 'ویرایش فاکتور خرید';
      document.getElementById('modal-purchase').classList.remove('hidden');
    }

    function onPurchaseProductChange() {
      const pId = document.getElementById('b-product').value;
      const p = db.products.find(x => x.id === pId);
      if (p) document.getElementById('b-price').value = p.buy;
    }

    function handlePurchaseSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('b-id').value;
      const pId = document.getElementById('b-product').value;
      const qty = Number(document.getElementById('b-qty').value);
      const price = Number(document.getElementById('b-price').value);
      const supplier = document.getElementById('b-supplier').value.trim();

      const prod = db.products.find(x => x.id === pId);
      if (!prod) return;

      const total = qty * price;

      if (id) {
        const bIndex = db.purchases.findIndex(x => x.id === id);
        if (bIndex !== -1) {
          const old = db.purchases[bIndex];
          prod.stock += (qty - old.qty);
          prod.buy = price;
          db.purchases[bIndex] = { id, productId: pId, productName: prod.name, qty, price, total, supplier };
        }
      } else {
        prod.stock += qty;
        prod.buy = price;
        db.purchases.unshift({ id: String(Date.now()), productId: pId, productName: prod.name, qty, price, total, supplier });
      }
      closeModal('modal-purchase');
      saveDB();
    }

    function deletePurchase(id) {
      const b = db.purchases.find(x => x.id === id);
      if (b && confirm('آیا فاکتور خرید حذف شود؟ (موجودی از انبار کسر خواهد شد)')) {
        const prod = db.products.find(x => x.id === b.productId);
        if (prod) prod.stock -= Number(b.qty);
        db.purchases = db.purchases.filter(x => x.id !== id);
        saveDB();
      }
    }

    function updateSelectOptions() {
      const opts = db.products.map(p => `<option value="${p.id}">${p.name} (موجودی: ${p.stock})</option>`).join('');
      document.getElementById('s-product').innerHTML = opts;
      document.getElementById('b-product').innerHTML = opts;
    }

    function saveStoreName() {
      const val = document.getElementById('store-name-input').value.trim();
      if (val) {
        db.name = val;
        saveDB();
        alert('نام فروشگاه ذخیره شد.');
      }
    }

    function exportDataJSON() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'backup.json';
      a.click();
    }

    function exportDataCSV() {
      let csv = "\uFEFFنوع,نام کالا,تعداد,قیمت واحد,مبلغ کل\n";
      db.products.forEach(p => { csv += `انبار,"${p.name}",${p.stock},${p.sell},${p.stock * p.sell}\n`; });
      db.sales.forEach(s => { csv += `فروش,"${s.productName}",${s.qty},${s.price},${s.total}\n`; });
      db.purchases.forEach(b => { csv += `خرید,"${b.productName}",${b.qty},${b.price},${b.total}\n`; });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'report.csv';
      a.click();
    }

    window.addEventListener('DOMContentLoaded', loadDB);
  </script>
</body>
</html>
